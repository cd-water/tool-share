server:
  port: 9090

spring:
  application:
    name: tool-share
  # 文件上传大小限制
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
  # 可选加载本地覆盖配置（git 忽略）
  config:
    import: optional:classpath:application-local.yml
  # MySQL
  datasource:
    url: jdbc:mysql://localhost:3306/${MYSQL_DATABASE:tool_share}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_ROOT_PASSWORD:toolmysql}
  # Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:toolredis}
  # RabbitMQ
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_DEFAULT_USER:toolrabbitmq}
    password: ${RABBITMQ_DEFAULT_PASS:toolrabbitmq}
    virtual-host: /
  # AI：DeepSeek 对话 + Ollama 向量化 + Qdrant 向量库（RAG 知识库）
  ai:
    openai:
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY:}
      chat:
        model: ${DEEPSEEK_CHAT_MODEL:deepseek-v4-flash}
      embedding:
        base-url: ${OLLAMA_BASE_URL:http://localhost:11434/v1}
        model: bge-m3
    vectorstore:
      qdrant:
        host: ${QDRANT_HOST:localhost}
        port: 6334 # gRPC 端口
        use-tls: false
        api-key: ${QDRANT_API_KEY:toolqdrant}
        collection-name: tool_share
        initialize-schema: true # 启动时自动建集合

# 认证鉴权
sa-token:
  token-name: Authorization # 请求头名，同时是 Redis key 前缀
  timeout: 2592000 # 30 天
  token-style: uuid
  is-read-body: false # 默认 true，这里关闭
  is-read-header: true
  is-read-cookie: false # 前后端分离，只走 header
  is-print: false # 关闭启动字符画

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

# MinIO 对象存储（自定义配置项）
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ROOT_USER:toolminio}
  secret-key: ${MINIO_ROOT_PASSWORD:toolminio}
  bucket: ${MINIO_BUCKET:tool-share}
