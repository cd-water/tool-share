server:
  port: 8900

spring:
  application:
    name: tool-share
  mvc:
    async:
      request-timeout: 120s
  # 文件上传大小限制
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
  # 可选加载本地覆盖配置（git 忽略）
  config:
    import: optional:classpath:application-local.yml
  datasource:
    url: jdbc:mysql://localhost:3806/${MYSQL_DATABASE:tool_share}
    username: root
    password: ${MYSQL_ROOT_PASSWORD:toolmysql}
  data:
    redis:
      host: localhost
      port: 6879
      password: ${REDIS_PASSWORD:toolredis}
      database: 0
  ai:
    openai:
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY:}
      chat:
        model: ${DEEPSEEK_CHAT_MODEL:deepseek-v4-flash}
      embedding:
        base-url: ${OLLAMA_BASE_URL:http://localhost:11934/v1}
        model: bge-m3
    vectorstore:
      qdrant:
        host: ${QDRANT_HOST:localhost}
        port: 6834 # gRPC 端口
        use-tls: false
        api-key: ${QDRANT_API_KEY:toolqdrant}
        collection-name: tool_share
        initialize-schema: true # 启动时自动建集合

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

# MinIO 对象存储（自定义配置项）
minio:
  # 后端 S3 客户端地址；容器部署时可以是内网地址
  endpoint: ${MINIO_ENDPOINT:http://localhost:9500}
  # 浏览器直连对象时使用的地址，必须能从用户浏览器访问
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9500}
  access-key: ${MINIO_ROOT_USER:toolminio}
  secret-key: ${MINIO_ROOT_PASSWORD:toolminio}
  bucket: ${MINIO_BUCKET:tool-share}

# 身份证 AES 密钥（16/24/32 字节），生产环境必须通过环境变量注入，无默认值
security:
  id-card-key: ${ID_CARD_AES_KEY:}

# 业务参数（不落库，按需覆盖）
toolshare:
  demo:
    # 空库启动时自动写入演示数据（SQL + 知识库语料）；生产环境设为 false
    seed-enabled: true
  auth:
    # Mock 短信演示默认在响应中返回验证码；接入真实短信或对外部署前必须改为 false
    expose-captcha: true
    # 同一验证码允许的最大尝试次数，达到后验证码失效
    max-attempts: 5
    rate-limit:
      phone-per-minute: 1
      phone-per-hour: 5
      ip-per-hour: 10
  upload:
    # 单张图片业务上限（5MB）；spring.servlet.multipart 的 50MB 只是容器兜底
    max-image-bytes: 5242880
    # 解码后的像素上限，防止小文件压缩炸弹
    max-image-pixels: 40000000
  message:
    # 是否启用 Mock 短信渠道；关闭时 SMS 偏好回退为站内消息
    sms-enabled: false
    # 用户未设置偏好时使用的默认渠道（SYSTEM/SMS）
    default-channel: SYSTEM
  rental:
    # 用户下单未选择「到期提醒」时使用的默认提前量（分钟），0 表示默认不提醒
    default-remind-minutes: 1440
    # 待支付租赁单超时时间（分钟），超时自动取消并释放档期
    pending-payment-timeout-minutes: 30
  availability:
    # 可预约时段的槽位粒度（分钟）
    slot-minutes: 30
    # 单次最多返回的建议窗口数
    max-suggestions: 3
    # 建议窗口向前搜索的天数上限
    search-days: 30
  ai:
    recommend:
      # 向量召回数量
      top-k: 20
      # 单次最多推荐数量（接口 limit 的上限）
      max-results: 5
      # 应用启动时全量重建工具向量索引
      index-on-startup: true
