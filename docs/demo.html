  .kv dt { color: var(--steel); }
  ol.steps { padding-left: 1.4em; }
  ol.steps li { margin-bottom: 4px; }

  .timeline { list-style: none; border-left: 3px solid var(--line); margin-left: 6px; }
  .timeline li { position: relative; padding: 0 0 18px 20px; }
  .timeline li::before {
    content: ""; position: absolute; left: -8.5px; top: 5px;
    width: 11px; height: 11px; border-radius: 50%;
    background: var(--steel); border: 2px solid #fff;
  }
  .timeline li.hot::before { background: var(--fix); }
  .timeline li.done::before { background: var(--ok); }
  .timeline .t { font-family: var(--mono); font-size: .76rem; color: var(--steel); }
  .timeline li.hot .h, .timeline li.done .h { font-weight: 600; }
  .timeline li.hot { border-left: 3px solid var(--fix); margin-left: -21.5px; padding-left: 38.5px; }
  .timeline li.hot::before { left: 14px; }

  .msg-item { display: flex; gap: 12px; padding: 14px 4px; border-bottom: 1px solid var(--line); }

  .msg-item .t { font-family: var(--mono); font-size: .76rem; color: var(--steel); }

  .chat .a { background: #fff; border: 1px solid var(--line); border-bottom-left-radius: 2px; }
  .chat .src { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .chat .src span { font-size: .74rem; background: #EFF3F0; border: 1px solid var(--line);

  .chat-input { display: flex; gap: 10px; margin-top: 14px; }
  .chat-input input { flex: 1; border: 1px solid var(--line); border-radius: 6px; padding: 9px 12px; font-size: .92rem; }

  /* ---------- 时段 ---------- */
  .slots { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 18px; }

  .slot.on { border-color: var(--ink); background: var(--ink); color: #fff; }

  /* ---------- 提示 ---------- */
  #toast {
    position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%);
    background: var(--ink); color: #fff; padding: 10px 22px; border-radius: 6px;
    font-size: .9rem; opacity: 0; pointer-events: none; transition: opacity .25s;
    z-index: 99;
  }
  #toast.show { opacity: 1; }

  /* ---------- 移动端 ---------- */
  @media (max-width: 760px) {
    .shell { flex-direction: column; }
    .side { width: 100%; height: auto; position: static; padding: 12px 0; }
    .brand { border-bottom: none; padding-bottom: 8px; }
    .nav-group { display: flex; flex-wrap: wrap; gap: 2px; padding: 0 12px; }
    .nav-group .nav-label { display: none; }
    .side a.nav-item { margin-bottom: 0; }
    .role-switch { margin: 10px 12px 0; }
    .main { padding: 22px 16px 60px; }
    .detail { grid-template-columns: 1fr; }
    .detail .seal-xl { height: 120px; font-size: 2.6rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>

const statusChip = s => {
  const map = { "可用": "ok", "已借出": "out", "维修中": "fix", "报废": "dead",
    "待支付": "warn", "已预约": "ok", "已取件": "out", "已归还": "", "已取消": "",
    "维修完成": "ok", "已完成": "ok" };
  return `<span class="chip ${map[s] || ""}">${esc(s)}</span>`;
};
const tagHtml = code => {
  const seal = { "WX": "维", "YY": "园", "QJ": "洁", "QT": "他" }[code.slice(5, 7)] || "工";
  return `<span class="tag"><span class="seal">${seal}</span>${code}</span>`;
};
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2200);
}
const go = h => { location.hash = h; };

const ROUTES = {
  "#/login": viewLogin,
  "#/tools": viewTools,
  "#/tool-detail": toolDetail,
  "#/rentals": viewRentals,
  "#/repairs": viewRepairs,
  "#/repair/new": viewRepairNew,
  "#/messages": viewMessages,
  "#/ai": viewAi,
  "#/admin/tools": viewAdminTools,
  "#/admin/rentals": viewAdminRentals,
  "#/admin/repairs": viewAdminRepairs,
  "#/admin/users": viewAdminUsers,
  "#/admin/audit": viewAdminAudit,
  "#/admin/kb": viewAdminKb,
};
const ADMIN_ONLY = ["#/admin/users", "#/admin/audit", "#/admin/kb"];

function render() {
  let route = location.hash || "#/login";
  if (route.startsWith("#/tool/")) route = "#/tool-detail";
  if (ADMIN_ONLY.includes(route)) state.role = "admin";
  else if (route.startsWith("#/admin") && state.role === "resident") state.role = "staff";
  const fn = ROUTES[route] || viewLogin;
  $app.innerHTML = fn();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", render);

function setRole(r) {
  state.role = r;
  const h = location.hash;
  if (r === "resident" && h.startsWith("#/admin")) go("#/tools");
  else if (r === "staff" && ADMIN_ONLY.includes(h)) go("#/admin/tools");
  else render();
}
function doLogin(e) { e.preventDefault(); state.role = "resident"; go("#/tools"); return false; }
function reserve() { toast("预约申请已提交，等待缴纳押金"); go("#/rentals"); }
function payOrder(no) {
  const o = orders.find(x => x.no === no);
  if (o) { o.status = "已预约"; o.pay = "已缴"; o.extra = "可于取件前 24 小时取消"; }
  toast("押金缴纳成功，预约已生效"); render();
}
function cancelOrder(no) {
  const o = orders.find(x => x.no === no);
  if (o) { o.status = "已取消"; o.pay = "已退还 " + o.deposit + " 元"; o.extra = "押金已原路退还"; }
  toast("预约已取消，押金原路退还"); render();
}
function submitRepair() { toast("报修申请已提交，等待工作人员核验"); go("#/repairs"); }
function readMsg(btn) {
  const item = btn.closest(".msg-item");
  item.classList.add("read"); btn.remove();
  toast("已标为已读");
}
function askAi(e) {
  e.preventDefault();
  const input = document.getElementById("ai-q");
  const q = input.value.trim();
  if (!q) return false;
  state.chatLog.push({ q: true, text: q });
  state.chatLog.push({ q: false, text: "根据社区工具租赁规则：逾期费用按 5 元/天计算，累计不超过该工具押金金额。归还验收时由工作人员核算并从押金中扣除。",
    src: ["社区工具租赁管理规则 · 第 6 条"] });
  render(); return false;
}
function auditTool(code) {
  const t = TOOLS.find(x => x.code === code); if (t) t.audit = "已通过";
  render(); toast("审核通过，工具已上架");
}
function rejectTool(code) {
  const t = TOOLS.find(x => x.code === code); if (t) t.audit = "需修改";
  render(); toast("已退回修改");
}
function changeRole(sel, id) {
  const u = users.find(x => x.id === id); if (u) u.role = sel.value;
  toast(`已将 ${u.name} 的角色调整为${u.role}`);
}
function toggleUser(btn, id) {
  const u = users.find(x => x.id === id); if (!u) return;
  u.status = u.status === "启用" ? "停用" : "启用";
  render(); toast(`账号 ${u.username} 已${u.status}`);
}
function uploadKb() {
  kbDocs.unshift({ name: "新上传文档.pdf", size: "—", chunks: null, status: "解析中" });
  render(); toast("文档已上传，解析中");
}
function removeKb(i) {
  kbDocs.splice(i, 1);
  render(); toast("文档已删除，向量同步清除");
}
function offTool(btn, code) {
  const t = TOOLS.find(x => x.code === code);
  if (t) { t.status = "下架"; render(); }
  toast("工具已下架");
}
function pickupOrder(btn) { btn.closest("td").innerHTML = statusChip("已取件"); toast("取件登记完成"); }
function returnOrder(btn) { btn.closest("td").innerHTML = "验收完好 · 已重新上架"; toast("归还验收完成，押金已退"); }
function addProgress(btn) {
  const r = repairs[0];
  r.timeline.push({ t: "10-05 15:40", h: "维修完成", d: "通电测试正常，待验收" });
  render(); toast("维修进度已更新");
}
function acceptRepair(btn) {
  const r = repairs[0];
  r.status = "已完成"; r.result = "验收合格，已重新上架";
  r.timeline.push({ t: "10-06 09:30", h: "验收合格", d: "工具恢复可用（李四）" });
  render(); toast("验收完成，工具重新上架");
}

render();
</script>
</body>
</html>
