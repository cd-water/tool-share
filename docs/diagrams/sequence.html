<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>社区共享工具租赁系统 · 核心时序</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F2F4F1;
    --ink: #1C3A35;
    --muted: #5F6E68;
    --soft: #7C8A84;
    --rule: rgba(28, 58, 53, 0.12);
    --accent: #E05206;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 56px 40px 40px;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .frame { max-width: 1340px; margin: 0 auto; }
  .eyebrow {
    font-family: 'Geist Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--soft);
    margin: 0 0 12px;
  }
  h1 {
    font-family: 'Instrument Serif', 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
    font-size: 1.75rem;
    font-weight: 400;
    letter-spacing: 0.02em;
    margin: 0 0 6px;
  }
  h2 {
    font-family: 'Geist Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    color: var(--ink);
    margin: 40px 0 4px;
  }
  .h2cn {
    font-size: 14px;
    color: var(--muted);
    margin: 0 0 20px;
  }
  .subtitle {
    font-size: 14px;
    color: var(--muted);
    margin: 0 0 28px;
  }
  .diagram { overflow-x: auto; }
  svg { width: 100%; height: auto; display: block; min-width: 960px; }
  .colophon {
    margin-top: 20px;
    padding-top: 12px;
    border-top: 1px solid var(--rule);
    font-family: 'Geist Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.08em;
    color: var(--soft);
  }
  @media (max-width: 760px) {
    body { padding: 32px 16px; }
    h1 { font-size: 1.4rem; }
  }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Sequence</p>
  <h1>社区共享工具租赁系统</h1>
  <p class="subtitle">核心时序图 · 租赁全流程（预约 → 支付 → 取件 → 报修 → 归还）与 AI 流式问答（SSE）</p>

  <h2>RENTAL LIFECYCLE</h2>
  <p class="h2cn">租赁全流程 · 押金沙箱支付 · 管理员核验闭环 · 消息通知</p>
  <div class="diagram">
    <svg role="img" aria-labelledby="seq-rental-title seq-rental-desc" viewBox="0 0 1340 1010" xmlns="http://www.w3.org/2000/svg">
      <title id="seq-rental-title">租赁全流程时序图</title>
      <desc id="seq-rental-desc">居民在前端创建预约并支付押金，管理员确认取件；居民提交报修后由管理员核验、更新维修进度并验收；最后管理员归还验收，系统计算费用并退款，双方收到消息通知。</desc>

      <defs>
        <style>
          .actor { font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 12px; font-weight: 600; fill: #1C3A35; }
          .actorec { font-family: 'Geist Mono', monospace; font-size: 8.5px; fill: #7C8A84; }
          .msg { font-family: 'Geist Mono', monospace; font-size: 9px; fill: #3A4A45; }
          .msgcn { font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 10px; fill: #5F6E68; }
          .phase { font-family: 'Geist Mono', monospace; font-size: 8px; letter-spacing: 0.16em; fill: #7C8A84; }
          .num { font-family: 'Geist Mono', monospace; font-size: 8px; fill: #E05206; font-weight: 600; }
        </style>
        <marker id="sarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0 0 L10 5 L0 10 z" fill="#5F6E68"/>
        </marker>
        <marker id="sarrow-back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0 0 L10 5 L0 10 z" fill="#8A968F"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#F2F4F1"/>

      <!-- ===== 参与者 ===== -->
      <g>
        <rect x="40" y="30" width="150" height="52" rx="6" fill="#FFFFFF" stroke="#1C3A35" stroke-width="1"/>
        <text class="actor" x="115" y="52" text-anchor="middle">居民</text>
        <text class="actorec" x="115" y="70" text-anchor="middle">用户端 :5901</text>

        <rect x="290" y="30" width="170" height="52" rx="6" fill="#FFFFFF" stroke="#1C3A35" stroke-width="1"/>
        <text class="actor" x="375" y="52" text-anchor="middle">管理员</text>
        <text class="actorec" x="375" y="70" text-anchor="middle">管理端 :5902</text>

        <rect x="560" y="30" width="200" height="52" rx="6" fill="#FEF3EF" stroke="#E05206" stroke-width="1.2"/>
        <text class="actor" x="660" y="52" text-anchor="middle">Spring Boot :8900</text>
        <text class="actorec" x="660" y="70" text-anchor="middle">module/rental · damage · message</text>

        <rect x="860" y="30" width="180" height="52" rx="6" fill="#FFFFFF" stroke="#1C3A35" stroke-width="1"/>
        <text class="actor" x="950" y="52" text-anchor="middle">MySQL / Redis</text>
        <text class="actorec" x="950" y="70" text-anchor="middle">:3806 · :6879</text>

        <rect x="1120" y="30" width="180" height="52" rx="6" fill="#FFFFFF" stroke="#1C3A35" stroke-width="1"/>
        <text class="actor" x="1210" y="52" text-anchor="middle">MinIO :9500</text>
        <text class="actorec" x="1210" y="70" text-anchor="middle">报修凭证图片</text>
      </g>

      <!-- ===== 生命线 ===== -->
      <g stroke="#7C8A84" stroke-width="0.9" stroke-dasharray="4 5">
        <line x1="115" y1="82" x2="115" y2="950"/>
        <line x1="375" y1="82" x2="375" y2="950"/>
        <line x1="660" y1="82" x2="660" y2="950"/>
        <line x1="950" y1="82" x2="950" y2="950"/>
        <line x1="1210" y1="82" x2="1210" y2="950"/>
      </g>

      <!-- ===== 阶段一：预约与支付 ===== -->
      <text class="phase" x="40" y="128">PHASE 1 · RESERVE &amp; PAY</text>
      <line x1="40" y1="138" x2="1300" y2="138" stroke="rgba(28,58,53,0.12)" stroke-width="0.8"/>

      <g fill="none" stroke="#5F6E68" stroke-width="1.1">
        <path d="M115 168 H660" marker-end="url(#sarrow)"/>
        <path d="M660 200 H950" marker-end="url(#sarrow)"/>
        <path d="M950 228 H660" stroke-dasharray="4 4" marker-end="url(#sarrow-back)"/>
        <path d="M660 256 H115" stroke-dasharray="4 4" marker-end="url(#sarrow-back)"/>
        <path d="M115 292 H660" marker-end="url(#sarrow)"/>
        <path d="M660 324 H950" marker-end="url(#sarrow)"/>
        <path d="M950 352 H660" stroke-dasharray="4 4" marker-end="url(#sarrow-back)"/>
      </g>
      <g>
        <text class="num" x="150" y="162">1</text><text class="msg" x="166" y="162">POST /api/user/rentals</text><text class="msgcn" x="330" y="162">创建预约 · 选择工具与时段 · 取件人</text>
        <text class="num" x="700" y="194">2</text><text class="msg" x="716" y="194">时段冲突校验 · Redis INCR 单号</text>
        <text class="msgcn" x="700" y="214">无重叠 → t_rental · PENDING_PAYMENT</text>
        <text class="msgcn" x="730" y="246">order_no = SQ-ZY-yyyyMMdd-XXXX</text>
        <text class="msgcn" x="240" y="250">预约单已创建（待支付）</text>
        <text class="num" x="150" y="286">3</text><text class="msg" x="166" y="286">POST /rentals/{id}/pay</text><text class="msgcn" x="330" y="286">沙箱支付押金</text>
        <text class="msgcn" x="700" y="318">押金 PAID · 状态 RESERVED</text>
        <text class="msgcn" x="730" y="346">写入消息：预约成功提醒（USER）</text>
      </g>

      <!-- ===== 阶段二：取件 ===== -->
      <text class="phase" x="40" y="408">PHASE 2 · PICKUP</text>
      <line x1="40" y1="418" x2="1300" y2="418" stroke="rgba(28,58,53,0.12)" stroke-width="0.8"/>

      <g fill="none" stroke="#5F6E68" stroke-width="1.1">
        <path d="M375 448 H660" marker-end="url(#sarrow)"/>
        <path d="M660 478 H950" marker-end="url(#sarrow)"/>
        <path d="M950 506 H660" stroke-dasharray="4 4" marker-end="url(#sarrow-back)"/>
      </g>
      <g>
        <text class="num" x="400" y="442">4</text><text class="msg" x="416" y="442">POST /api/admin/rentals/{id}/pickup</text><text class="msgcn" x="580" y="442">确认取件</text>
        <text class="msgcn" x="700" y="472">租赁 → PICKED_UP · 工具 → RENTED · 工具日志</text>
        <text class="msgcn" x="730" y="500">写入消息：取件成功 · 到期前 24h 提醒待调度</text>
      </g>

      <!-- ===== 阶段三：报修与维修 ===== -->
      <text class="phase" x="40" y="556">PHASE 3 · DAMAGE &amp; REPAIR</text>
      <line x1="40" y1="566" x2="1300" y2="566" stroke="rgba(28,58,53,0.12)" stroke-width="0.8"/>

      <g fill="none" stroke="#5F6E68" stroke-width="1.1">
        <path d="M115 596 H660" marker-end="url(#sarrow)"/>
        <path d="M115 624 H1210" marker-end="url(#sarrow)"/>
        <path d="M1210 652 H660" stroke-dasharray="4 4" marker-end="url(#sarrow-back)"/>
        <path d="M375 688 H660" marker-end="url(#sarrow)"/>
        <path d="M660 716 H950" marker-end="url(#sarrow)"/>
        <path d="M375 752 H660" marker-end="url(#sarrow)"/>
        <path d="M660 780 H950" marker-end="url(#sarrow)"/>
      </g>
      <g>
        <text class="num" x="150" y="590">5</text><text class="msg" x="166" y="590">POST /api/user/damage-reports</text><text class="msgcn" x="380" y="590">损坏部位 · 描述 · 图片URL</text>
        <text class="msgcn" x="700" y="620">报修 SQ-BX-* · SUBMITTED · 通知管理员</text>
        <text class="num" x="150" y="618">6</text><text class="msg" x="166" y="618">PUT /api/files/{key}</text><text class="msgcn" x="330" y="618">上传损坏凭证照片</text>
        <text class="msgcn" x="1000" y="646">返回 /api/files/{key} 公开访问地址</text>
        <text class="num" x="400" y="682">7</text><text class="msg" x="416" y="682">POST …/{id}/verify → CONFIRMED</text><text class="msgcn" x="600" y="682">核验 · 指定维修负责人</text>
        <text class="msgcn" x="700" y="710">报修 → VERIFIED · 工具 → MAINTENANCE</text>
        <text class="num" x="400" y="746">8</text><text class="msg" x="416" y="746">POST …/progress → …/{id}/accept</text><text class="msgcn" x="600" y="746">维修进度 REPAIRING → 验收 QUALIFIED</text>
        <text class="msgcn" x="700" y="774">报修 → COMPLETED · 工具 → AVAILABLE</text>
      </g>

      <!-- ===== 阶段四：归还结算 ===== -->
      <text class="phase" x="40" y="826">PHASE 4 · RETURN &amp; SETTLE</text>
      <line x1="40" y1="836" x2="1300" y2="836" stroke="rgba(28,58,53,0.12)" stroke-width="0.8"/>

      <g fill="none" stroke="#5F6E68" stroke-width="1.1">
        <path d="M375 866 H660" marker-end="url(#sarrow)"/>
        <path d="M660 894 H950" marker-end="url(#sarrow)"/>
        <path d="M660 926 H115" stroke="#E05206" stroke-dasharray="5 4" marker-end="url(#sarrow)"/>
      </g>
      <g>
        <text class="num" x="400" y="860">9</text><text class="msg" x="416" y="860">POST …/rentals/{id}/return</text><text class="msgcn" x="580" y="860">归还验收 · 完好</text>
        <text class="msgcn" x="700" y="888">租赁 → RETURNED · 逾期/损坏费结算 · REFUNDED</text>
        <text class="msgcn" x="240" y="920">消息推送：押金已退还 ¥200（抵扣后）</text>
      </g>

      <!-- ===== 图例 ===== -->
      <line x1="40" y1="964" x2="1300" y2="964" stroke="rgba(28,58,53,0.12)" stroke-width="0.8"/>
      <text x="40" y="988" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.14em" fill="#7C8A84">LEGEND</text>
      <text x="130" y="988" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="500" fill="#5F6E68">实线 · 请求 / 写库</text>
      <text x="330" y="988" font-family="'Geist Mono', monospace" font-size="9" fill="#5F6E68">- - -&gt;</text>
      <text x="406" y="988" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="500" fill="#5F6E68">响应 / 消息通知</text>
      <text class="num" x="560" y="988">■</text>
      <text x="578" y="988" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="500" fill="#5F6E68">橙色为关键业务结果（退款）</text>
    </svg>
  </div>

  <h2>AI STREAMING · SSE</h2>
  <p class="h2cn">AI 流式问答 · 向量检索优先 · LLM 异常自动降级兜底</p>
  <div class="diagram">
    <svg role="img" aria-labelledby="seq-ai-title seq-ai-desc" viewBox="0 0 1340 560" xmlns="http://www.w3.org/2000/svg">
      <title id="seq-ai-title">AI 流式问答时序图</title>
      <desc id="seq-ai-desc">居民提问后，前端以 fetch 发起 SSE 请求；后端先做向量检索（Qdrant 失败降级关键词），发送 sources 事件；再调用 DeepSeek 流式生成，逐条发送 message 事件；前端逐字渲染；LLM 异常时流式输出兜底文案。</desc>

      <defs>
        <marker id="aiarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0 0 L10 5 L0 10 z" fill="#5F6E68"/>
        </marker>
        <marker id="aiarrow-back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0 0 L10 5 L0 10 z" fill="#8A968F"/>
        </marker>
        <marker id="aiarrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0 0 L10 5 L0 10 z" fill="#E05206"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#F2F4F1"/>

      <!-- ===== 参与者 ===== -->
      <g>
        <rect x="40" y="30" width="150" height="52" rx="6" fill="#FFFFFF" stroke="#1C3A35" stroke-width="1"/>
        <text class="actor" x="115" y="52" text-anchor="middle">居民</text>
        <text class="actorec" x="115" y="70" text-anchor="middle">AiPage 输入问题</text>

        <rect x="290" y="30" width="170" height="52" rx="6" fill="#FFFFFF" stroke="#1C3A35" stroke-width="1"/>
        <text class="actor" x="375" y="52" text-anchor="middle">用户端前端</text>
        <text class="actorec" x="375" y="70" text-anchor="middle">chatStream（fetch）</text>

        <rect x="560" y="30" width="200" height="52" rx="6" fill="#FEF3EF" stroke="#E05206" stroke-width="1.2"/>
        <text class="actor" x="660" y="52" text-anchor="middle">Spring Boot :8900</text>
        <text class="actorec" x="660" y="70" text-anchor="middle">module/ai · AiService</text>

        <rect x="860" y="30" width="180" height="52" rx="6" fill="#FFFFFF" stroke="#1C3A35" stroke-width="1"/>
        <text class="actor" x="950" y="52" text-anchor="middle">Qdrant / Ollama</text>
        <text class="actorec" x="950" y="70" text-anchor="middle">向量检索 · :6833 / :11934</text>

        <rect x="1120" y="30" width="180" height="52" rx="6" fill="#FFFFFF" stroke="#E05206" stroke-width="1.2" stroke-dasharray="6 4"/>
        <text class="actor" x="1210" y="52" text-anchor="middle">DeepSeek API</text>
        <text class="actorec" x="1210" y="70" text-anchor="middle">对话模型 · 流式</text>
      </g>

      <!-- ===== 生命线 ===== -->
      <g stroke="#7C8A84" stroke-width="0.9" stroke-dasharray="4 5">
        <line x1="115" y1="82" x2="115" y2="470"/>
        <line x1="375" y1="82" x2="375" y2="470"/>
        <line x1="660" y1="82" x2="660" y2="470"/>
        <line x1="950" y1="82" x2="950" y2="470"/>
        <line x1="1210" y1="82" x2="1210" y2="470"/>
      </g>

      <!-- ===== 消息 ===== -->
      <g fill="none" stroke="#5F6E68" stroke-width="1.1">
        <path d="M115 130 H375" marker-end="url(#aiarrow)"/>
        <path d="M375 162 H660" marker-end="url(#aiarrow)"/>
        <path d="M660 194 H950" marker-end="url(#aiarrow)"/>
        <path d="M950 222 H660" stroke-dasharray="4 4" marker-end="url(#aiarrow-back)"/>
        <path d="M660 252 H375" stroke-dasharray="4 4" stroke="#E05206" marker-end="url(#aiarrow-accent)"/>
        <path d="M660 286 H1210" marker-end="url(#aiarrow)"/>
        <path d="M1210 340 H660" stroke-dasharray="4 4" stroke="#E05206" marker-end="url(#aiarrow-accent)"/>
        <path d="M660 372 H375" stroke-dasharray="4 4" stroke="#E05206" marker-end="url(#aiarrow-accent)"/>
        <path d="M375 404 H115" marker-end="url(#aiarrow)"/>
      </g>
      <g>
        <text class="num" x="150" y="124">1</text><text class="msgcn" x="166" y="124">输入问题 · 点击发送</text>
        <text class="num" x="400" y="156">2</text><text class="msg" x="416" y="156">POST /api/user/ai/chat/stream</text>
        <text class="msgcn" x="416" y="176">Accept: text/event-stream · Bearer 头</text>
        <text class="num" x="700" y="188">3</text><text class="msg" x="716" y="188">similaritySearch Top-K</text>
        <text class="msgcn" x="716" y="208">失败/为空 → 降级关键词检索（MySQL LIKE）</text>
        <text class="msgcn" x="480" y="246">event: sources（来源标题与片段）</text>
        <text class="num" x="700" y="280">4</text><text class="msg" x="716" y="280">ChatClient.stream（知识库上下文 + 问题）</text>
        <text class="msg" x="1000" y="336">token 增量流</text>
        <text class="msgcn" x="480" y="366">event: message × N（增量文本）</text>
        <text class="msgcn" x="180" y="398">逐字渲染 · 参考来源展示</text>
      </g>

      <!-- ===== 降级说明 ===== -->
      <g>
        <rect x="290" y="428" width="760" height="34" rx="5" fill="#FFFFFF" stroke="#7C8A84" stroke-width="1" stroke-dasharray="6 4"/>
        <text class="msgcn" x="306" y="450">兜底：DeepSeek 不可用或异常时，仍以 message 事件流式输出知识库检索摘要，事件流完整结束，前端无空泡。</text>
      </g>

      <!-- ===== 图例 ===== -->
      <line x1="40" y1="496" x2="1300" y2="496" stroke="rgba(28,58,53,0.12)" stroke-width="0.8"/>
      <text x="40" y="520" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.14em" fill="#7C8A84">LEGEND</text>
      <text x="130" y="520" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="500" fill="#5F6E68">实线 · 请求</text>
      <text x="300" y="520" font-family="'Geist Mono', monospace" font-size="9" fill="#5F6E68">- - -&gt;</text>
      <text x="376" y="520" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="500" fill="#5F6E68">响应 / SSE 事件（橙）</text>
    </svg>
  </div>

  <p class="colophon">SEQUENCE · tool-share · 押金、单号与状态机详见 module/rental 与 module/damage · 时序图为关键路径示意</p>
</div>
</body>
</html>
