name: tool-share

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0.46
    container_name: tool-share-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../db/mysql.cnf:/etc/mysql/conf.d/zz-app.cnf:ro
    networks:
      - tool-share-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}" ]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s
      start_interval: 5s
  # Redis 缓存
  redis:
    image: redis:7.4.11
    container_name: tool-share-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - tool-share-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 10s
      start_interval: 5s
  # RabbitMQ 消息队列
  rabbitmq:
    image: rabbitmq:4.1.8-management
    container_name: tool-share-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ../rabbitmq/rabbitmq_delayed_message_exchange-4.1.0.ez:/opt/rabbitmq/plugins/rabbitmq_delayed_message_exchange-4.1.0.ez:ro
      - ../rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - tool-share-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity" ]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 90s
      start_interval: 10s
  # MinIO 对象存储
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: tool-share-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - tool-share-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/ready" ]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s
      start_interval: 5s
  # Qdrant 向量数据库
  qdrant:
    image: qdrant/qdrant:v1.17.0
    container_name: tool-share-qdrant
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - tool-share-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6333 && printf \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'" ]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s
      start_interval: 5s
  # Ollama 大模型服务
  ollama:
    image: ollama/ollama:0.33.3
    container_name: tool-share-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - tool-share-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s
      start_interval: 5s
  # 一次性任务：等 Ollama 就绪后拉取 bge-m3 向量模型
  ollama-model-init:
    image: ollama/ollama:0.33.3
    container_name: tool-share-ollama-model-init
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        echo "Waiting for Ollama service..."
        until ollama list >/dev/null 2>&1; do
          sleep 2
        done
        echo "Pulling model bge-m3..."
        ollama pull bge-m3
    environment:
      OLLAMA_HOST: http://ollama:11434
    networks:
      - tool-share-network
    depends_on:
      ollama:
        condition: service_healthy

networks:
  tool-share-network:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  minio-data:
  qdrant-data:
  ollama-data:
