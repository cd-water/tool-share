name: ticket-box

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0.46
    container_name: ticket-box-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - ticket-box-network
    restart: unless-stopped
  # Redis 缓存
  redis:
    image: redis:7.4.11
    container_name: ticket-box-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - ticket-box-network
    restart: unless-stopped

networks:
  ticket-box-network:
    driver: bridge

volumes:
  mysql-data:
  redis-data: